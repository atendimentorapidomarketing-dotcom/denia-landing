<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar — DENIA AI</title><link rel="stylesheet" href="/auth.css"></head><body>
<main class="wrap"><div class="brand">DENIA <b>AI</b></div><h1>Ingresar a DENIA Control</h1><p class="muted">Accede a la operación, entrenamiento, conversaciones, rendimiento e integraciones.</p>
<form id="form"><label>Correo</label><input name="email" type="email" required autocomplete="email"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"><button>Ingresar</button><div id="msg"></div></form><a class="secondary" href="/">← Volver a la experiencia</a></main>
<script>const f=document.getElementById('form'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){m.className='error';m.textContent=j.error||'Não foi possível entrar.';return}location.href='/es/app'});</script></body></html>
