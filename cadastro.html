<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Criar acesso — DENIA AI</title><link rel="stylesheet" href="/auth.css">
<style id="denia-v15-mobile-lock">
html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;overflow-x:hidden!important;overscroll-behavior-x:none!important;background:#04070b!important}
body{position:relative!important;touch-action:pan-y pinch-zoom}
*,*:before,*:after{box-sizing:border-box}
img,svg,video,iframe,canvas{max-width:100%!important}
@media(max-width:900px){
  html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
  body>*{max-width:100%!important}
}
</style>
</head><body>
<main class="wrap"><div class="brand">DENIA <b>AI</b></div><h1>Crie seu acesso</h1><p class="muted">Na fase atual, o primeiro cadastro cria a organização principal e o acesso de administrador da equipe.</p>
<form id="form"><label>Nome</label><input name="name" required><label>E-mail</label><input name="email" type="email" required><label>Senha</label><input name="password" type="password" minlength="10" required><label>Confirmar senha</label><input name="confirm" type="password" minlength="10" required><button>Criar conta</button><div id="msg"></div></form><a class="secondary" href="/login">Já tenho acesso</a></main>
<script>const f=document.getElementById('form'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.password!==d.confirm){m.className='error';m.textContent='As senhas não coincidem.';return}const r=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){m.className='error';m.textContent=(j.error||'Não foi possível criar a conta.')+(j.detail?' — '+j.detail:'');return}location.href='/app'});</script></body></html>
