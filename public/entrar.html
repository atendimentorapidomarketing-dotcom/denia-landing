<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — DENIA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04060c">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/entrar.css">
</head>
<body>
  <main class="entrar">
    <section class="entrar-caixa vidro" aria-labelledby="titulo">
      <a class="entrar-marca" href="/"><img src="/assets/img/logo.svg" alt="" width="40" height="40"><span>DENIA</span></a>
      <h1 id="titulo">Acesse o centro de comando</h1>
      <p class="entrar-sub">Entre com o seu e-mail e a sua senha.</p>
      <form id="form-entrar" class="entrar-form" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input class="entrada" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input class="entrada" id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <p class="entrar-erro oculto" id="erro" role="alert"></p>
        <button class="btn btn-primario" id="botao" type="submit">Entrar</button>
      </form>
      <p class="entrar-rodape"><span class="ponto"></span> Conexão protegida · sessão válida por 8 horas</p>
    </section>
    <a class="entrar-voltar" href="/">← Voltar ao site</a>
  </main>
  <script src="/assets/js/entrar.js" defer></script>
</body>
</html>
